<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Launcher page filled by the Today widget</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
a{color:#ee9020}a:hover{color:#f5b45e}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; padding: 44px 12px 20px; display: flex; flex-direction: column; background: #0a1a21; font-family: ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; color: rgba(255,255,255,.95)">

  <div style="box-sizing: border-box; flex-grow: 1; min-height: 0; border-radius: 26px; background: #0c3142; border: 1px solid rgba(255,255,255,.12); padding: 16px 18px 8px; display: flex; flex-direction: column; gap: 11px">

    <div style="display: flex; justify-content: center; align-items: baseline; gap: 22px">
      <span style="display: inline-block; font-size: 44px; font-weight: 700; line-height: 1; transform: scaleX(1.32); font-variant-numeric: tabular-nums">9:27</span>
      <span style="font-size: 16px; font-weight: 600; color: rgba(255,255,255,.72)">PM</span>
    </div>

    <div style="display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 10px; padding: 8px 12px; border-radius: 16px; background: rgba(255,255,255,.06)">
      <div style="display: flex; flex-direction: column; gap: 1px">
        <span style="font-size: 12px; color: rgba(255,255,255,.72)">Sat, Nov 14</span>
        <span style="font-size: 15px; font-weight: 700">Jackson, MI</span>
        <span style="font-size: 13px">Showers</span>
      </div>
      <svg width="46" height="46" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M17.5 15H8a5 5 0 1 1 1.1-9.9A6 6 0 0 1 20 7.6 3.8 3.8 0 0 1 17.5 15z"/><path d="M9 18l-1 3M13 18l-1 3M17 18l-1 3"/></svg>
      <div style="display: flex; flex-direction: column; align-items: flex-end; gap: 2px">
        <span style="font-size: 30px; font-weight: 700; line-height: 1">37°</span>
        <span style="font-size: 13px; color: rgba(255,255,255,.8)">44° / 32°</span>
      </div>
    </div>

    <div style="height: 1px; background: rgba(255,255,255,.12)"></div>

    <div style="display: flex; align-items: center; justify-content: space-between">
      <button type="button" aria-label="Previous category" onClick="{{ prev }}" style="width: 44px; height: 34px; border: 0; border-radius: 17px; background: rgba(255,255,255,.08); color: rgba(255,255,255,.95); display: flex; align-items: center; justify-content: center; cursor: pointer">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 6l-6 6 6 6"/></svg>
      </button>
      <div style="display: flex; flex-direction: column; align-items: center; gap: 2px">
        <span style="font-size: 12px; font-weight: 700; letter-spacing: .08em; color: #ee9020">{{ cat.label }}</span>
        <span style="font-size: 11px; color: rgba(255,255,255,.6)">{{ cat.position }}</span>
      </div>
      <button type="button" aria-label="Next category" onClick="{{ next }}" style="width: 44px; height: 34px; border: 0; border-radius: 17px; background: rgba(255,255,255,.08); color: rgba(255,255,255,.95); display: flex; align-items: center; justify-content: center; cursor: pointer">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg>
      </button>
    </div>

    <div style="flex-grow: 1; min-height: 0; overflow: hidden; display: flex; flex-direction: column; justify-content: space-between; gap: 6px">
      <sc-for list="{{ cat.items }}" as="item" hint-placeholder-count="6">
        <div style="display: flex; flex-direction: column; gap: 2px">
          <span style="font-size: 11px; color: rgba(255,255,255,.66)"><b style="color: rgba(255,255,255,.85); font-weight: 600">{{ item.source }}</b> · {{ item.age }}</span>
          <span style="font-size: 14px; font-weight: 500; line-height: 1.28">{{ item.title }}</span>
        </div>
      </sc-for>
    </div>

    <div style="height: 1px; background: rgba(255,255,255,.12)"></div>

    <div style="display: flex; flex-direction: column; gap: 5px">
      <span style="font-size: 11px; font-weight: 700; letter-spacing: .08em; color: rgba(255,255,255,.66)">WATCHLIST</span>
      <sc-for list="{{ quotes }}" as="q" hint-placeholder-count="5">
        <div style="display: flex; align-items: baseline; gap: 10px">
          <span style="flex-grow: 1; font-size: 13px; font-weight: 600">{{ q.name }}</span>
          <span style="font-size: 13px; font-variant-numeric: tabular-nums">{{ q.price }}</span>
          <span style="width: 68px; text-align: right; font-size: 12px; font-variant-numeric: tabular-nums; color: {{ q.color }}">{{ q.move }}</span>
        </div>
      </sc-for>
    </div>

    <div style="display: flex; justify-content: space-between; align-items: center">
      <span style="font-size: 11px; color: rgba(255,255,255,.6)">News and stocks updated 9:14 PM</span>
      <button type="button" aria-label="Refresh now" style="width: 36px; height: 32px; border: 0; border-radius: 16px; background: transparent; color: rgba(255,255,255,.72); display: flex; align-items: center; justify-content: center; cursor: pointer">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12a9 9 0 1 1-2.6-6.4"/><path d="M21 4v5h-5"/></svg>
      </button>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { i: 2 }; }
  renderVals() {
    const cats = [
      { label: 'LOCAL · JACKSON, MI', items: [
        { source: 'WLNS 6', age: '49m', title: 'How to watch Detroit Lions vs. New England Patriots: TV, streaming, betting odds' },
        { source: 'MLive Jackson', age: '1h', title: 'Leaking container in Jackson office prompts HAZMAT response' },
        { source: 'MLive Jackson', age: '1h', title: 'Jackson Civil War Society plans winter quarters event at Waterloo Farm Museum' },
        { source: 'WLNS 6', age: '1h', title: 'Hazmat crews secure leaking chemical container inside Jackson building' },
        { source: 'MLive Jackson', age: '3h', title: 'Crash kills Coldwater man and 5-year-old son, injures 4-year-old daughter' },
        { source: 'WLNS 6', age: '3h', title: 'The Aimcriers bring southwestern heat to Mid-Michigan' } ] },
      { label: 'REGIONAL · MICHIGAN', items: [
        { source: 'Bridge Michigan', age: '2h', title: '[Michigan statewide headline]' },
        { source: 'Michigan Advance', age: '3h', title: '[Michigan statewide headline]' },
        { source: 'Bridge Michigan', age: '5h', title: '[Michigan statewide headline]' },
        { source: 'Michigan Advance', age: '6h', title: '[Michigan statewide headline]' },
        { source: 'Bridge Michigan', age: '8h', title: '[Michigan statewide headline]' },
        { source: 'Michigan Advance', age: '9h', title: '[Michigan statewide headline]' } ] },
      { label: 'NATIONAL', items: [
        { source: 'CBS News', age: '20m', title: 'Evacuation lifted after bomb threat near industrial plant in Illinois' },
        { source: 'CBS News', age: '25m', title: 'Watch: Massive waves, flooding batter Northern California' },
        { source: 'NPR', age: '34m', title: 'FAA ground stop disrupts college football' },
        { source: 'CBS News', age: '52m', title: 'Netanyahu says it’s time to remove Iran threat “once and for all”' },
        { source: 'NPR', age: '1h', title: 'Florida city cancels St. Patrick’s Day parade, citing new anti-DEI law' },
        { source: 'CBS News', age: '1h', title: '3 killed when SUV crashes into North Hollywood food stand' } ] },
      { label: 'INTERNATIONAL', items: [
        { source: 'DW', age: '34m', title: 'Tens of thousands continue to protest across France' },
        { source: 'DW', age: '2h', title: 'Philippines wins first Eurovision Song Contest Asia' },
        { source: 'DW', age: '3h', title: 'SpaceX carries out first-ever spaceship capture' },
        { source: 'DW', age: '4h', title: 'Germany’s 2027 budget: A record €561 billion and a mountain of debt' },
        { source: 'DW', age: '4h', title: 'Nigeria’s upcoming election marred by rising AI disinformation' },
        { source: 'DW', age: '4h', title: 'South Sudan pushes back elections amid violent flare-ups' } ] },
    ];
    const i = this.state.i;
    const step = (d) => () => this.setState({ i: (i + d + cats.length) % cats.length });
    const up = '#4ade80', down = '#f87171';
    return {
      cat: { ...cats[i], position: (i + 1) + ' of ' + cats.length },
      prev: step(-1),
      next: step(1),
      quotes: [
        { name: 'NVDA', price: '162.85', move: '▼ 2.01%', color: down },
        { name: 'MSFT', price: '523.88', move: '▲ 0.17%', color: up },
        { name: 'AAPL', price: '356.27', move: '▲ 0.39%', color: up },
        { name: '[YOUR 4TH]', price: '—', move: '—', color: 'rgba(255,255,255,.6)' },
        { name: '[YOUR 5TH]', price: '—', move: '—', color: 'rgba(255,255,255,.6)' },
      ],
    };
  }
}
</script>
</body>
</html>
