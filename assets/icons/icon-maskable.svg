<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="Happening Now app icon">
  <!--
    Maskable variant for Android adaptive icons (W3C spec). The OS crops
    the canvas to a circle, squircle, square, or teardrop depending on
    launcher theme. Important content must fit within the 80%-diameter
    safe zone (a centered circle of radius 204.8). Background fills the
    full 512x512 with no rounded corners so masking shows no transparent
    edges.
  -->
  <defs>
    <linearGradient id="hnOuterM" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#14405d"/>
      <stop offset="100%" stop-color="#0c3142"/>
    </linearGradient>
    <linearGradient id="hnMidM" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ee9020"/>
      <stop offset="100%" stop-color="#c66f1c"/>
    </linearGradient>
    <radialGradient id="hnCoreM" cx="50%" cy="40%" r="55%">
      <stop offset="0%" stop-color="#fff2dc"/>
      <stop offset="55%" stop-color="#ee9020"/>
      <stop offset="100%" stop-color="#b6510c"/>
    </radialGradient>
  </defs>
  <rect width="512" height="512" fill="url(#hnOuterM)"/>
  <rect x="160" y="160" width="192" height="192" rx="40" ry="40" fill="url(#hnMidM)"/>
  <circle cx="256" cy="256" r="36" fill="url(#hnCoreM)"/>
</svg>
