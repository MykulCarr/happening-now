<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 200" role="img" aria-label="Happening Now!">
  <!--
    Horizontal lockup: mark + wordmark. Designed for dark navy backgrounds
    (matches the site's primary theme). For use on light backgrounds, swap
    text fills via CSS (e.g. via the wordmark <g class="hnLogoText">).
  -->
  <defs>
    <linearGradient id="lwOuter" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#14405d"/>
      <stop offset="100%" stop-color="#0c3142"/>
    </linearGradient>
    <linearGradient id="lwMid" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ee9020"/>
      <stop offset="100%" stop-color="#c66f1c"/>
    </linearGradient>
    <radialGradient id="lwCore" cx="50%" cy="40%" r="55%">
      <stop offset="0%" stop-color="#fff2dc"/>
      <stop offset="55%" stop-color="#ee9020"/>
      <stop offset="100%" stop-color="#b6510c"/>
    </radialGradient>
  </defs>

  <!-- Mark, scaled from icon.svg (512px) down to 160px -->
  <g transform="translate(20, 20) scale(0.3125)">
    <rect width="512" height="512" rx="96" ry="96" fill="url(#lwOuter)"/>
    <rect x="12" y="12" width="488" height="488" rx="86" ry="86" fill="none" stroke="#066284" stroke-width="2" opacity="0.35"/>
    <rect x="144" y="144" width="224" height="224" rx="44" ry="44" fill="url(#lwMid)"/>
    <circle cx="256" cy="256" r="42" fill="url(#lwCore)"/>
  </g>

  <!-- Wordmark. Uses system font stack so it renders without a webfont request. -->
  <g class="hnLogoText" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="88" letter-spacing="-1">
    <text x="210" y="130" fill="#f5e9d6">HAPPENING<tspan fill="#ee9020" dx="6">NOW</tspan><tspan fill="#c66f1c">!</tspan></text>
  </g>
</svg>
