<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-label="Happening Now! — your live dashboard for news, weather, and markets">
  <!--
    Open Graph / Twitter Card image, 1200x630 (Facebook & Twitter optimal).
    Most scrapers now accept SVG; if a target doesn't (older Slack, some
    crawlers), this can be exported to PNG by opening in a browser at the
    target size and screenshotting, or via:
      npx svgexport og-image.svg og-image.png 1200:630
  -->
  <defs>
    <linearGradient id="ogBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#14405d"/>
      <stop offset="55%" stop-color="#0c3142"/>
      <stop offset="100%" stop-color="#082434"/>
    </linearGradient>
    <linearGradient id="ogMid" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ee9020"/>
      <stop offset="100%" stop-color="#c66f1c"/>
    </linearGradient>
    <radialGradient id="ogCore" cx="50%" cy="40%" r="55%">
      <stop offset="0%" stop-color="#fff2dc"/>
      <stop offset="55%" stop-color="#ee9020"/>
      <stop offset="100%" stop-color="#b6510c"/>
    </radialGradient>
    <!-- soft amber glow behind the mark, for atmosphere -->
    <radialGradient id="ogGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ee9020" stop-opacity="0.20"/>
      <stop offset="55%" stop-color="#b6510c" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#0c3142" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#ogBg)"/>

  <!-- Soft glow behind the mark -->
  <circle cx="280" cy="315" r="340" fill="url(#ogGlow)"/>

  <!-- Decorative concentric rings (subtle "broadcast" ripple) -->
  <g stroke="#066284" fill="none" stroke-width="1" opacity="0.18">
    <circle cx="280" cy="315" r="160"/>
    <circle cx="280" cy="315" r="200"/>
    <circle cx="280" cy="315" r="240"/>
    <circle cx="280" cy="315" r="280"/>
  </g>

  <!-- Mark, scaled from icon.svg (512px) to 240px -->
  <g transform="translate(160, 195) scale(0.46875)">
    <rect width="512" height="512" rx="96" ry="96" fill="url(#ogBg)"/>
    <rect x="12" y="12" width="488" height="488" rx="86" ry="86" fill="none" stroke="#066284" stroke-width="2" opacity="0.45"/>
    <rect x="144" y="144" width="224" height="224" rx="44" ry="44" fill="url(#ogMid)"/>
    <circle cx="256" cy="256" r="42" fill="url(#ogCore)"/>
  </g>

  <!-- Wordmark -->
  <g font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-weight="900" letter-spacing="-2">
    <text x="450" y="298" font-size="96" fill="#f5e9d6">HAPPENING</text>
    <text x="450" y="408" font-size="124" fill="#ee9020">NOW<tspan fill="#c66f1c">!</tspan></text>
  </g>

  <!-- Tagline -->
  <text x="450" y="470" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="28" font-weight="500" fill="#c8d8e3" letter-spacing="2">
    NEWS · WEATHER · MARKETS — LIVE
  </text>

  <!-- Footer URL -->
  <text x="450" y="540" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="600" fill="#ee9020" letter-spacing="1">
    happening-now.net
  </text>
</svg>
