<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <!-- Admin only: behind Cloudflare Access, plus a token check in the Worker
       (cloudflare-sync-worker/src/admin.mjs). No GA tag on purpose — the
       owner's own visits aren't traffic. -->
  <meta name="robots" content="noindex,nofollow" />
  <title>Happening Now! - Admin</title>
  <style>html,body{background:#0c3142;margin:0}</style>
  <link rel="icon" type="image/svg+xml" href="assets/icons/icon.svg" />
  <link rel="stylesheet" href="assets/styles.css">
  <link rel="stylesheet" href="assets/report.css">
  <link rel="stylesheet" href="assets/admin.css?v=20261019c">
</head>
<body>
  <header id="topbar"></header>

  <main class="container adPage">
    <div class="adHead">
      <h1>Admin</h1>
      <span class="adWho" id="adSignedIn">Loading…</span>
      <button type="button" class="btn adIconBtn" id="adRefresh" aria-label="Refresh" title="Refresh">↻</button>
    </div>

    <!-- Summary tiles: everything at a glance; tap one to open its detail view. -->
    <div class="adTiles" role="tablist" aria-label="Sections">
      <button type="button" class="adTile" role="tab" data-view="reports" aria-selected="false" aria-controls="adDetail">
        <span class="adTileNum" id="tReports">–</span>
        <span class="adTileLabel">Reports</span>
        <span class="adTileSub" id="tReportsSub">&nbsp;</span>
      </button>
      <button type="button" class="adTile" role="tab" data-view="pulse" aria-selected="false" aria-controls="adDetail">
        <span class="adTileNum" id="tPulse">–</span>
        <span class="adTileLabel">Useful</span>
        <span class="adTileSub" id="tPulseSub">&nbsp;</span>
      </button>
      <button type="button" class="adTile" role="tab" data-view="cloudflare" aria-selected="false" aria-controls="adDetail">
        <span class="adTileNum" id="tCf">–</span>
        <span class="adTileLabel">Cloudflare · 7 days</span>
        <span class="adTileSub" id="tCfSub">&nbsp;</span>
      </button>
      <button type="button" class="adTile" role="tab" data-view="sweep" aria-selected="false" aria-controls="adDetail">
        <span class="adTileNum" id="tSweep">–</span>
        <span class="adTileLabel">Feed sweep</span>
        <span class="adTileSub" id="tSweepSub">&nbsp;</span>
      </button>
    </div>

    <section class="card adDetail" id="adDetail" role="tabpanel" hidden>
      <div class="adDetailHead">
        <h2 id="adDetailTitle"></h2>
        <button type="button" class="btn adIconBtn" id="adClose" aria-label="Close">✕</button>
      </div>
      <div id="adDetailBody"></div>
    </section>

    <nav class="adLinks" aria-label="Admin links">
      <a href="https://dash.cloudflare.com/3949da63d9ab140c1997f85b14086013/workers/services/view/happening-now-sync/production" target="_blank" rel="noopener">Worker</a>
      <a href="https://dash.cloudflare.com/3949da63d9ab140c1997f85b14086013/workers/d1/databases/7b2d7670-f0db-40a3-8fa3-ca102585b6dc" target="_blank" rel="noopener">Database</a>
      <a href="https://dash.cloudflare.com/3949da63d9ab140c1997f85b14086013/one/access-controls/apps" target="_blank" rel="noopener">Access</a>
      <a href="https://analytics.happening-now.net/admin" target="_blank" rel="noopener">Usage</a>
      <a href="https://analytics.google.com/" target="_blank" rel="noopener">Analytics</a>
      <a href="https://search.google.com/search-console" target="_blank" rel="noopener">Search Console</a>
      <a href="/feedback">Feedback page</a>
    </nav>
  </main>

  <script defer src="assets/common.js"></script>
  <script defer src="assets/topbar.js"></script>
  <script defer src="assets/admin-analytics.js?v=20261025a"></script>
  <script defer src="assets/admin.js?v=20261019c"></script>
</body>
</html>
